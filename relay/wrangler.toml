# I.R.I.S. Link relay (Cloudflare Workers, free plan).
# Deploy: npm run deploy (builds the web app from app/ into public/, then wrangler deploy)   ·   Secret: npx wrangler secret put SERVER_KEY
name = "iris"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# No account_id here: wrangler uses the account you logged in with (or
# CLOUDFLARE_ACCOUNT_ID if your login can reach several).

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, Cloudflare answers asset requests itself and the Worker never
# sees them, so its security headers (src/headers.ts) would not be sent. The
# hashed files under /assets are left out: they are static and cost no Worker run.
run_worker_first = ["/*", "!/assets/*"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
