# Tests and type checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude iris-desktop

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && npx tsc --noEmit -p .
        working-directory: relay

  # Known vulnerabilities in the dependencies. It reports but does not block
  # (`continue-on-error`): new advisories appear without anyone touching the
  # code, so they are read and decided on, not allowed to turn every build red.
  # The ignored ones are understood: lopdf's crash is contained because PDFs
  # are read in a separate worker process (crates/engine/src/attachments.rs).
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --ignore RUSTSEC-2026-0187
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund && npm audit --omit=dev --audit-level=high
        working-directory: app
      - run: npm ci --no-fund && npm audit --omit=dev --audit-level=high
        working-directory: relay

  # The phone app still has to build.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
