# Pushing a tag like v0.2.0 builds the Windows installer and the Android APK
# and attaches both to a draft GitHub release, named with the version
# (IRIS-Setup-x64-v0.2.0.exe, IRIS-Android-v0.2.0.apk). scripts/publish-public.sh
# points README's download buttons at them.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) "IRIS-Setup-x64-${{ github.ref_name }}.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: IRIS-Setup-x64-*.exe

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # A real signing key keeps updates installable over each other. Without
      # these secrets the release stops here instead of publishing an APK that
      # is signed with a throwaway debug key.
      - name: Require the signing key
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::The Android signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Published APKs must always use the same key."
          exit 1
      - name: Signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/android/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: android
        env:
          IRIS_REQUIRE_RELEASE_KEY: 'true'
      - run: cp android/app/build/outputs/apk/release/app-release.apk "IRIS-Android-${{ github.ref_name }}.apk"
      # Shows which key signed the APK (compare it with the last release) and
      # refuses a debug-signed one.
      - name: Check the signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "IRIS-Android-${{ github.ref_name }}.apk")
          echo "$CERTS" | grep -i "SHA-256"
          if echo "$CERTS" | grep -qi "Android Debug"; then
            echo "::error::The APK is signed with the Android debug key"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: IRIS-Android-*.apk

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/windows-installer/*.exe
            out/android-apk/*.apk
